<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>xau-lab</title>
<link rel="stylesheet" href="site.css">
<!-- Static shell only: no research content lives in this repo. app.js reads it from a private database after sign-in. -->
<script>try{if(localStorage.getItem('xau.session'))document.documentElement.dataset.auth='in'}catch(e){}</script>
</head>
<body data-page="index">
<div class="scrollbar" aria-hidden="true"></div>
<main>
  <nav class="top">
    <span class="brand"><i></i>xau-lab</span>
    <span class="nav-r authed"><span id="updated"></span><button type="button" class="signout" id="signout">退出</button></span>
  </nav>
  <section class="intro">
    <div class="intro-copy">
      <p class="eyebrow">XAUUSD · first passage</p>
      <h1 id="intro-title">黄金概率实验</h1>
      <p>短周期概率研究。旁边是模拟基准：无漂移随机游走在止盈线和止损线之间的首达结果，不是行情。</p>
      <form class="login" method="post" action="#" autocomplete="on">
        <h2>登录后查看</h2>
        <p>研究内容存放在私有数据库，仅所有者可读。</p>
        <label>邮箱<input type="email" name="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required></label>
        <label>密码<input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit">登录</button>
        <p class="msg" role="alert"></p>
        <noscript><p class="msg">需要启用 JavaScript 才能登录。</p></noscript>
      </form>
      <ul class="tally authed" id="tally" hidden></ul>
    </div>
    <!-- Decorative baseline, drawn by site.js: driftless random walks between the take-profit and stop-out barriers. Not market data. -->
    <div class="sim" hidden>
      <canvas data-walk="hero" role="img" aria-label="示意动画：随机游走路径从入场线出发，触及上方止盈线、下方止损线或超时结束"></canvas>
      <div class="rr" role="group" aria-label="盈亏比">
        <button type="button" data-rr="1" aria-pressed="false">1:1</button><button type="button" data-rr="2" aria-pressed="true">1:2</button><button type="button" data-rr="3" aria-pressed="false">1:3</button>
      </div>
      <div class="hud">
        <dl class="shares">
          <div class="sh-win"><dt>止盈</dt><dd data-share="win">—</dd></div>
          <div class="sh-loss"><dt>止损</dt><dd data-share="loss">—</dd></div>
          <div class="sh-out"><dt>超时</dt><dd data-share="out">—</dd></div>
        </dl>
        <div class="split" aria-hidden="true"><i class="sh-win"></i><i class="sh-loss"></i><i class="sh-out"></i></div>
        <p class="note">模拟基准（非行情）：无漂移随机游走，含点差 0.08R · 已结束胜率 <b data-share="rate">—</b> · 盈亏平衡 <b data-share="be">33.3%</b> · <span data-share="n">0</span> 条</p>
      </div>
    </div>
  </section>
  <section class="live authed" id="live" hidden>
    <h2>正在执行 <span id="live-age"></span></h2>
    <div id="live-jobs"></div>
  </section>
  <p class="state authed" id="state" role="status" hidden></p>
  <section class="cards authed" id="cards" hidden></section>
</main>
<script src="config.js"></script>
<script src="site.js"></script>
<script src="app.js"></script>
</body>
</html>
